[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskregister"
version = "1.0.0"
description = "Risk register, KRI monitoring and executive reporting for GRC portfolios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carlos Caceres" }]
keywords = ["grc", "risk-register", "kri", "iso-27001", "nist-csf", "cybersecurity"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
riskregister = "riskregister.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
